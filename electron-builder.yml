appId: dev.idris.nimbus
productName: Nimbus
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!themes-dev/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,NIMBUS_SPEC.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # Agent SDK は同梱 CLI バイナリを spawn するため asar 外に展開する（asar 内は実行不可）
  - node_modules/@anthropic-ai/**
win:
  executableName: nimbus
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # ad-hoc 署名（開発者証明書の実名が配布物の署名に埋め込まれるのを防ぐ）
  identity: null
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Idris
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
